<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users | Vision Vanguard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />


  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="root"></div>


  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="text/babel">

    /* 
    BACKEND: Lahat ng data sa page nato galing sa constants sa baba (USERS, ROLES, STATUSES, PERMISSIONS).
    REPLACE NYO YUNG CONSTANTS. DUN NYO ILAGAY YUNG API DATA.*/
    // BACKEND: USERS - isa per account. Yung role ay isa sa ROLES. YUNG status kailangan exactly 'Active' or 'Disabled' kase eto pumipili ng badge color. Yung lastDate and lastTime ay strings (PHT).

    const USERS = [
      // { id: 1, name: 'Irene Ticzon', username: 'maria.irene', role: 'Admin', status: 'Active', lastDate: '14 Oct 2026', lastTime: '08:02 PHT' },
      // { id: 2, name: 'Khelvin Galvez', username: 'khelbean', role: 'Traffic enforcer', status: 'Active', lastDate: '14 Oct 2026', lastTime: '08:10 PHT' },
      // { id: 3, name: 'Loui Naquita', username: 'admiral.larwix', role: 'Traffic enforcer', status: 'Active', lastDate: '13 Oct 2026', lastTime: '16:32 PHT' },
    ];

    // BACKEND: ROLES and STATUSES - eto yung laman ng dropdowns (filters at Add user form). Pwede nyong dagdagan or bawasan.
    const ROLES = ['Administrator', 'Traffic Enforcer'];
    const STATUSES = ['Active', 'Disabled'];

    // BACKEND: PERMISSIONS - isa per permission. Yung admin and enforcer ay true or false lang. true = check mark, false = dash.
    const PERMISSIONS = [
      { id: 1, name: 'View live feed', admin: true, enforcer: true },
      { id: 2, name: 'Manual override and emergency clear', admin: true, enforcer: true },
      { id: 3, name: 'View reports', admin: true, enforcer: true },
      { id: 4, name: 'Export reports', admin: true, enforcer: false },
      { id: 5, name: 'Manage users', admin: true, enforcer: false },
      { id: 6, name: 'Edit settings', admin: true, enforcer: false },
    ];

    const { useState } = React;

    function LogoMark() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M7 20V4M3 8l4-4 4 4" />
          <path d="M17 4v16M13 16l4 4 4-4" />
        </svg>
      );
    }

    function DashboardIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </svg>
      );
    }

    function LiveIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="2" />
          <path d="M4.93 19.07a10 10 0 0 1 0-14.14" />
          <path d="M7.76 16.24a6 6 0 0 1 0-8.48" />
          <path d="M16.24 7.76a6 6 0 0 1 0 8.48" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        </svg>
      );
    }

    function ReportsIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M3 3v18h18" />
          <path d="M18 17V9" />
          <path d="M13 17V5" />
          <path d="M8 17v-3" />
        </svg>
      );
    }

    function UsersIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      );
    }

    function SettingsIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M21 4h-7" />
          <path d="M10 4H3" />
          <path d="M21 12h-9" />
          <path d="M8 12H3" />
          <path d="M21 20h-5" />
          <path d="M12 20H3" />
          <path d="M14 2v4" />
          <path d="M8 10v4" />
          <path d="M16 18v4" />
        </svg>
      );
    }

    function CalendarIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4" />
          <path d="M8 2v4" />
          <path d="M3 10h18" />
        </svg>
      );
    }

    function BellIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
      );
    }

    function LogoutIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="m16 17 5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
      );
    }

    function ShieldCheckIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      );
    }

    function SearchIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
      );
    }

    function CheckIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      );
    }

    function EyeIcon({ hidden }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          {hidden ? (
            <>
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
              <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <path d="m2 2 20 20" />
            </>
          ) : (
            <>
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </>
          )}
        </svg>
      );
    }

    const NAV_ITEMS = [
      { label: 'Dashboard', icon: <DashboardIcon />, active: false },
      { label: 'Live control', icon: <LiveIcon />, active: false },
      { label: 'Reports', icon: <ReportsIcon />, active: false },
      { label: 'Users', icon: <UsersIcon />, active: true },
      { label: 'Settings', icon: <SettingsIcon />, active: false },
    ];


    function Sidebar() {
      return (
        <aside className="sidebar">
          <header className="brand brand--sidebar">
            <span className="brand__mark"><LogoMark /></span>
            <span className="brand__name">
              <span>Vision</span>
              <span>Vanguard</span>
            </span>
          </header>

          <p className="sidebar__label">Operations workspace</p>

          <nav className="nav">
            {/* 
              BACKEND: LAHAT ng nav links ay "#" for now. 
              Bigyan nyo lahat ng item ng real route and tas i set active nyo sa current page. 
            */}
            {NAV_ITEMS.map((item) => (
              <a
                key={item.label}
                className={`nav__item${item.active ? ' is-active' : ''}`}
                href="#"
              >
                {item.icon}
                <span>{item.label}</span>
              </a>
            ))}
          </nav>


          <footer className="sidebar__footer">
            <div className="user">
              <span className="user__avatar">IT</span>
              <span className="user__info">
                <span className="user__name">Irene Ticzon</span>
                <span className="user__role">Administrator</span>
              </span>
            </div>

            <button type="button" className="logout">
              <LogoutIcon />
              Logout
            </button>
          </footer>
        </aside>
      );
    }


    function Topbar() {
      return (
        <header className="topbar">
          <h1 className="topbar__title">Users</h1>

          <div className="topbar__actions">

            <button type="button" className="date-button">
              <CalendarIcon />
              Today
            </button>

            <p className="topbar__time">14 Oct 2026 · 15:24:08 PHT</p>

            <p className="badge badge--online">
              <span className="badge__dot" />
              System online
            </p>

            <span className="topbar__bell"><BellIcon /></span>
          </div>
        </header>
      );
    }



    function UserFilters() {
      // BACKEND: Yung filters.search, filters.role and filters.status ang gamitin nyo pang filter ng USERS table.
      const [filters, setFilters] = useState({ search: '', role: 'All roles', status: 'All statuses' });

      const handleChange = (event) => {
        const { name, value } = event.target;
        setFilters((prev) => ({
          ...prev,
          [name]: value,
        }));
      };

      return (
        <section className="panel panel--filters">
          <div className="filters filters--users">
            <div className="field">
              <label className="field__label" htmlFor="search">Search users</label>
              <div className="field__control">
                <input
                  className="field__input field__input--icon"
                  id="search"
                  name="search"
                  type="text"
                  placeholder="Name, username or email"
                  value={filters.search}
                  onChange={handleChange}
                />
                <span className="field__icon"><SearchIcon /></span>
              </div>
            </div>

            <div className="field">
              <label className="field__label" htmlFor="role-filter">Role</label>
              <select
                className="field__input field__select"
                id="role-filter"
                name="role"
                value={filters.role}
                onChange={handleChange}
              >
                <option value="All roles">All roles</option>
                {ROLES.map((role) => (
                  <option key={role} value={role}>{role}</option>
                ))}
              </select>
            </div>

            <div className="field">
              <label className="field__label" htmlFor="status-filter">Status</label>
              <select
                className="field__input field__select"
                id="status-filter"
                name="status"
                value={filters.status}
                onChange={handleChange}
              >
                <option value="All statuses">All statuses</option>
                {STATUSES.map((status) => (
                  <option key={status} value={status}>{status}</option>
                ))}
              </select>
            </div>
          </div>
        </section>
      );
    }


    function UserTable() {
      return (
        <section className="panel">
          <div className="panel__header panel__header--center">
            <h2 className="panel__title">User accounts</h2>
            <p className="panel__meta">Showing 1–{USERS.length} of {USERS.length} accounts</p>
          </div>

          <div className="table-wrap">
            <table className="table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Username</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Last sign-in</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {USERS.map((user) => (
                  <tr key={user.id}>
                    <td>{user.name}</td>
                    <td>{user.username}</td>
                    <td>{user.role}</td>
                    <td>
                      <span className={`badge badge--${user.status.toLowerCase()}`}>
                        <span className="badge__dot" />
                        {user.status}
                      </span>
                    </td>
                    <td>
                      <span className="cell-stack">
                        <span>{user.lastDate}</span>
                        <span>{user.lastTime}</span>
                      </span>
                    </td>
                    <td>
                      {/* 
                        BACKEND: Lagyan nyo ng onClick yung Edit, Disable and Reset password per row. Yung Disable ay gawing Enable pag Disabled na yung user.
                      */}
                      <div className="row-actions">
                        <button type="button" className="row-action row-action--edit">Edit</button>
                        <button type="button" className="row-action row-action--disable">Disable</button>
                        <button type="button" className="row-action row-action--reset">Reset password</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* 
            BACKEND: Lagyan nyo ng onClick yung Previous, page numbers and Next kung dumami na yung users.
          */}
          <nav className="pagination" aria-label="Pagination">
            <button type="button" className="pagination__item" disabled>‹ Previous</button>
            <button type="button" className="pagination__item is-active">1</button>
            <button type="button" className="pagination__item" disabled>Next ›</button>
          </nav>

          <p className="info-bar">
            <ShieldCheckIcon />
            Only administrators can create accounts, export reports, or change system settings.
          </p>
        </section>
      );
    }


    function AddUser() {
      // BACKEND: PREFILLED LANG YUNG FORM SA BABA PARA MA MATCH SA DESIGN. Gawin nyong '' lahat ng initial values (at active: true) pag nilagay nyo na sa app.
      // BACKEND: Yung form field names ay fullName, email, username, role, password and active. Eto gamitin nyo pag mag se send ng create user request.
      const [values, setValues] = useState({
        fullName: '',
        email: '',
        username: '',
      
        // TODO @momspider: Translate from frontend UI yung values ng `role` para maging
        // either ADMINISTRATOR or ENFORCER lang, since ayun lang narerecognize ng database.
        role: '',
        password: '',
        phone: '',
        active: true,  // TODO: Translate rin from boolean true/false to either ACTIVE or DISABLED since yun yung enum na need ni database
      });
      const [showPassword, setShowPassword] = useState(false);
      
      const handleChange = (event) => {
        const { name, type, value, checked } = event.target;
        setValues((prev) => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value,
        }));
      };
      
      const handleSubmit = async (event) => {
        event.preventDefault();
        // BACKEND: ise send nyo yung values sa create user endpoint dito.
        // BACKEND: Pag success i reset nyo yung form and i refresh yung USERS table. On failure show an error message (basic error handling lang yan).
        try {
          console.log(values);
          const response = await fetch("/api/v1/users", {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },

            // TODO: Dagdagan lang ng frontend sanitation para malinis na agad yung input pag-fetch
            body: JSON.stringify({
              "full_name": values["fullName"],
              "email": values["email"],
              "username": values["username"],
              "role": values["role"],
              "password": values["password"],
              "phone": values["phone"],
              "status": values["active"] ? "ACTIVE" : "DISABLED",
            })
          });
          if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
          }
        } catch (error) {
          console.error(error.message);
        }
      };

      return (
        <section className="panel">
          <h2 className="panel__title">Add user</h2>

          <form className="stack-form" onSubmit={handleSubmit}>
            <div className="field">
              <label className="field__label" htmlFor="fullName">Full name</label>
              <input
                className="field__input"
                id="fullName"
                name="fullName"
                type="text"
                value={values.fullName}
                onChange={handleChange}
                required
              />
            </div>

            <div className="field">
              <label className="field__label" htmlFor="email">Email</label>
              <input
                className="field__input"
                id="email"
                name="email"
                type="email"
                value={values.email}
                onChange={handleChange}
                required
              />
            </div>

            <div className="field">
              <label className="field__label" htmlFor="username">Username</label>
              <input
                className="field__input"
                id="username"
                name="username"
                type="text"
                value={values.username}
                onChange={handleChange}
                required
              />
            </div>

            // TODO: Appropriate fields para numbers lang accepted
            <div className="field">
              <label className="field__label" htmlFor="phone">Phone Number</label>
              <input
                className="field__input"
                id="phone"
                name="phone"
                type="text"
                value={values.phone}
                onChange={handleChange}
                required
              />
            </div>

            <div className="field">
              <label className="field__label" htmlFor="role">Role</label>
              <select
                className="field__input field__select"
                id="role"
                name="role"
                value={values.role}
                onChange={handleChange}
              >
                {ROLES.map((role) => (
                  <option key={role} value={role}>{role}</option>
                ))}
              </select>
            </div>

            <div className="field">
              <label className="field__label" htmlFor="password">Temporary password</label>
              <div className="field__control">
                <input
                  className="field__input field__input--password"
                  id="password"
                  name="password"
                  type={showPassword ? 'text' : 'password'}
                  autoComplete="new-password"
                  value={values.password}
                  onChange={handleChange}
                  required
                />
                <button
                  type="button"
                  className="icon-button"
                  onClick={() => setShowPassword((prev) => !prev)}
                  aria-label={showPassword ? 'Hide password' : 'Show password'}
                >
                  <EyeIcon hidden={!showPassword} />
                </button>
              </div>
            </div>

            <div className="checkbox-list">
              <label className="checkbox">
                <input
                  type="checkbox"
                  name="active"
                  checked={values.active}
                  onChange={handleChange}
                />
                <span>Account active</span>
              </label>
            </div>

            {/* 
              BACKEND: Yung Save user ay nag su submit ng form. Yung Cancel naman dapat i clear yung form (lagyan nyo ng onClick).
            */}
            <div className="button-row">
              <button type="submit" className="action-button action-button--green action-button--full">
                Save user
              </button>
              <button type="button" className="action-button action-button--light action-button--full">
                Cancel
              </button>
            </div>
          </form>
        </section>
      );
    }


    function RolePermissions() {
      return (
        <section className="panel">
          <h2 className="panel__title">Role permissions</h2>

          <div className="table-wrap">
            <table className="table table--permissions">
              <thead>
                <tr>
                  <th>Permission</th>
                  <th>Administrator</th>
                  <th>Traffic Enforcer</th>
                </tr>
              </thead>
              <tbody>
                {PERMISSIONS.map((permission) => (
                  <tr key={permission.id}>
                    <td>{permission.name}</td>
                    <td>
                      {permission.admin ? (
                        <span className="perm perm--yes"><CheckIcon /></span>
                      ) : (
                        <span className="perm perm--no">—</span>
                      )}
                    </td>
                    <td>
                      {permission.enforcer ? (
                        <span className="perm perm--yes"><CheckIcon /></span>
                      ) : (
                        <span className="perm perm--no">—</span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      );
    }


    function App() {
      return (
        <div className="page page--dashboard">
          <Sidebar />
          <main className="main">
            <Topbar />
            <div className="content">
              <UserFilters />
              <div className="split split--left">
                <UserTable />
                <AddUser />
              </div>
              <RolePermissions />
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
