<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports | Vision Vanguard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />


  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="root"></div>


  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="text/babel">

    /* 
    BACKEND: Lahat ng number na ginagamit sa page nato galing sa constants sa baba (STATS, HOURLY, AXIS, WAIT_BY_HOUR, WAIT_AXIS, EVENTS, PAGINATION).
    REPLACE NYO YUNG CONSTANTS. DUN NYO ILAGAY YUNG API DATA.*/ 
    // BACKEND: STATS - Same format sa dashboard. Yung "tone" pumipili sa card color (orange, blue, green, yellow, red) Gawin nyong as is lang to.
    const STATS = [
      { label: 'Total vehicles', value: '1,240', note: '08:00-15:24 · Both ends', tone: 'orange' },
      { label: '2W : 4W split', value: '60% : 40%', note: '744 2W / 496 4W', tone: 'blue' },
      { label: 'Average wait', value: '18s', note: 'Across both directions', tone: 'green' },
      { label: 'Maximum wait', value: '46s', note: 'Recorded at 10:18', tone: 'yellow' },
      { label: 'Emergency activations', value: '02', note: 'Simulated events · Resolved', tone: 'red' },
    ];

    // BACKEND: HOURLY - one row per hour. Yunng hour ay 'HH:00' string, twoW and fourW naman ay numbers. Bar heights are computed from these, no styling needed.
    const HOURLY = [
      { hour: '08:00', twoW: 43, fourW: 27 },
      { hour: '09:00', twoW: 78, fourW: 52 },
      { hour: '10:00', twoW: 125, fourW: 95 },
      { hour: '11:00', twoW: 100, fourW: 60 },
      { hour: '12:00', twoW: 70, fourW: 40 },
      { hour: '13:00', twoW: 115, fourW: 85 },
      { hour: '14:00', twoW: 138, fourW: 92 },
      { hour: '15:00', twoW: 75, fourW: 45 },
    ];

    // BACKEND: Kung yung isa sa mga hour's total (twoW + fourW) kaya lumagpas above 240, i raise AXIS_MAX and i update AXIS para ma match (highest value first, evenly spaced, ending at 0).
    const AXIS = [240, 180, 120, 60, 0];
    const AXIS_MAX = 240;

    // BACKEND: WAIT_BY_HOUR - one row per hour. Yung seconds ay average wait ng hour nayon (number lang). Dapat same yung mga hour sa HOURLY.
    const WAIT_BY_HOUR = [
      { hour: '08:00', seconds: 12 },
      { hour: '09:00', seconds: 15 },
      { hour: '10:00', seconds: 24 },
      { hour: '11:00', seconds: 19 },
      { hour: '12:00', seconds: 14 },
      { hour: '13:00', seconds: 16 },
      { hour: '14:00', seconds: 22 },
      { hour: '15:00', seconds: 16 },
    ];

    // BACKEND: Same rule sa AXIS. Kung may seconds na lumagpas sa WAIT_AXIS_MAX, i raise nyo and i update yung WAIT_AXIS.
    const WAIT_AXIS = [30, 22.5, 15, 7.5, 0];
    const WAIT_AXIS_MAX = 30;

    // BACKEND: REPORT_TYPES and ENDS - eto yung laman ng dropdowns sa filters. Pwede nyong dagdagan or bawasan.
    const REPORT_TYPES = ['Traffic volume', 'Average wait', 'Event history', 'Emergency activations'];
    const ENDS = ['Both ends', 'A / North', 'B / South'];

    // BACKEND: EVENTS - events ng napiling date range, newest first (alam nyo nayan). Gawin nyong unique yung id (row key). YUNG decision kailangan exactly 'Go' or 'Wait' kase it picks the badge color. Yung wait ay string na may unit, ex. '12 s'.
    const EVENTS = [
      { id: 1, time: '15:24:08', end: 'A / North', vehicle: '4W · car', confidence: '98.4%', decision: 'Go', wait: '12 s' },
      { id: 2, time: '15:24:06', end: 'B / South', vehicle: '2W · bicycle', confidence: '96.2%', decision: 'Wait', wait: '18 s' },
      { id: 3, time: '15:24:04', end: 'A / North', vehicle: '2W · motorcycle', confidence: '95.7%', decision: 'Go', wait: '09 s' },
      { id: 4, time: '15:24:02', end: 'B / South', vehicle: '2W · motorcycle', confidence: '94.8%', decision: 'Wait', wait: '22 s' },
      { id: 5, time: '15:23:59', end: 'B / South', vehicle: '4W · car', confidence: '97.1%', decision: 'Wait', wait: '24 s' },
      { id: 6, time: '14:42:18', end: 'A / North', vehicle: '4W · car', confidence: '97.6%', decision: 'Go', wait: '03 s' },
    ];

    // BACKEND: PAGINATION - showing at total ay para sa "Showing 1-6 of 1,240 events". Yung pages ay list ng page numbers, current ay yung active page.
    const PAGINATION = { showing: '1–6', total: '1,240', pages: [1, 2], current: 1 };

    const { useState } = React;

    function LogoMark() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M7 20V4M3 8l4-4 4 4" />
          <path d="M17 4v16M13 16l4 4 4-4" />
        </svg>
      );
    }

    function DashboardIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </svg>
      );
    }

    function LiveIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="2" />
          <path d="M4.93 19.07a10 10 0 0 1 0-14.14" />
          <path d="M7.76 16.24a6 6 0 0 1 0-8.48" />
          <path d="M16.24 7.76a6 6 0 0 1 0 8.48" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        </svg>
      );
    }

    function ReportsIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M3 3v18h18" />
          <path d="M18 17V9" />
          <path d="M13 17V5" />
          <path d="M8 17v-3" />
        </svg>
      );
    }

    function UsersIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      );
    }

    function SettingsIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M21 4h-7" />
          <path d="M10 4H3" />
          <path d="M21 12h-9" />
          <path d="M8 12H3" />
          <path d="M21 20h-5" />
          <path d="M12 20H3" />
          <path d="M14 2v4" />
          <path d="M8 10v4" />
          <path d="M16 18v4" />
        </svg>
      );
    }

    function CalendarIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4" />
          <path d="M8 2v4" />
          <path d="M3 10h18" />
        </svg>
      );
    }

    function BellIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
      );
    }

    function LogoutIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="m16 17 5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
      );
    }

    function DownloadIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M12 15V3" />
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <path d="m7 10 5 5 5-5" />
        </svg>
      );
    }

    function FileIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
          <path d="M14 2v4a2 2 0 0 0 2 2h4" />
          <path d="M16 13H8" />
          <path d="M16 17H8" />
          <path d="M10 9H8" />
        </svg>
      );
    }

    function RefreshIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
      );
    }

    const NAV_ITEMS = [
      { label: 'Dashboard', icon: <DashboardIcon />, active: false },
      { label: 'Live control', icon: <LiveIcon />, active: false },
      { label: 'Reports', icon: <ReportsIcon />, active: true },
      { label: 'Users', icon: <UsersIcon />, active: false },
      { label: 'Settings', icon: <SettingsIcon />, active: false },
    ];


    function Sidebar() {
      return (
        <aside className="sidebar">
          <header className="brand brand--sidebar">
            <span className="brand__mark"><LogoMark /></span>
            <span className="brand__name">
              <span>Vision</span>
              <span>Vanguard</span>
            </span>
          </header>

          <p className="sidebar__label">Operations workspace</p>

          <nav className="nav">
            {/* 
              BACKEND: LAHAT ng nav links ay "#" for now. 
              Bigyan nyo lahat ng item ng real route and tas i set active nyo sa current page. 
            */}
            {NAV_ITEMS.map((item) => (
              <a
                key={item.label}
                className={`nav__item${item.active ? ' is-active' : ''}`}
                href="#"
              >
                {item.icon}
                <span>{item.label}</span>
              </a>
            ))}
          </nav>


          <footer className="sidebar__footer">
            <div className="user">
              <span className="user__avatar">IT</span>
              <span className="user__info">
                <span className="user__name">Irene Ticzon</span>
                <span className="user__role">Administrator</span>
              </span>
            </div>
          
            <button type="button" className="logout">
              <LogoutIcon />
              Logout
            </button>
          </footer>
        </aside>
      );
    }


    function Topbar() {
      return (
        <header className="topbar">
          <h1 className="topbar__title">Reports</h1>

          <div className="topbar__actions">

            <button type="button" className="date-button">
              <CalendarIcon />
              Today
            </button>

            <p className="topbar__time">14 Oct 2026 · 15:24:08 PHT</p>

            <p className="badge badge--online">
              <span className="badge__dot" />
              System online
            </p>

            <span className="topbar__bell"><BellIcon /></span>
          </div>
        </header>
      );
    }



    function ReportActions() {
      return (
        <div className="toolbar">
          {/* 
            BACKEND: Lagyan nyo ng onClick yung Export CSV and Export PDF. Dapat yung current filters and report ang i export.
          */}
          <button type="button" className="action-button action-button--light">
            <DownloadIcon />
            Export CSV
          </button>
          <button type="button" className="action-button action-button--red">
            <FileIcon />
            Export PDF
          </button>
        </div>
      );
    }


    function ReportFilters() {
      // BACKEND: Yung field names ay from, to, type and end. Eto gamitin nyo pag mag se send ng report request.
      const [values, setValues] = useState({
        from: '14 Oct 2026, 08:00',
        to: '14 Oct 2026, 15:24',
        type: 'Traffic volume',
        end: 'Both ends',
      });

      const handleChange = (event) => {
        const { name, value } = event.target;
        setValues((prev) => ({
          ...prev,
          [name]: value,
        }));
      };

      const handleSubmit = (event) => {
        event.preventDefault();
        // BACKEND: ise send nyo yung values.from, values.to, values.type and values.end sa report endpoint dito.
        // BACKEND: Pag success i update nyo yung STATS, HOURLY, WAIT_BY_HOUR and EVENTS base sa response.
      };

      return (
        <section className="panel panel--filters">
          {/* 
            BACKEND: Text lang muna yung From and To (naka format na '14 Oct 2026, 08:00'). Palitan nyo ng real date picker kung gusto nyo.
          */}
          <form className="filters filters--report" onSubmit={handleSubmit}>
            <div className="field">
              <label className="field__label" htmlFor="from">From · Date / time</label>
              <div className="field__control">
                <input
                  className="field__input field__input--icon"
                  id="from"
                  name="from"
                  type="text"
                  value={values.from}
                  onChange={handleChange}
                />
                <span className="field__icon"><CalendarIcon /></span>
              </div>
            </div>

            <div className="field">
              <label className="field__label" htmlFor="to">To · Date / time</label>
              <div className="field__control">
                <input
                  className="field__input field__input--icon"
                  id="to"
                  name="to"
                  type="text"
                  value={values.to}
                  onChange={handleChange}
                />
                <span className="field__icon"><CalendarIcon /></span>
              </div>
            </div>

            <div className="field">
              <label className="field__label" htmlFor="type">Report type</label>
              <select
                className="field__input field__select"
                id="type"
                name="type"
                value={values.type}
                onChange={handleChange}
              >
                {REPORT_TYPES.map((type) => (
                  <option key={type} value={type}>{type}</option>
                ))}
              </select>
            </div>

            <div className="field">
              <label className="field__label" htmlFor="end">End</label>
              <select
                className="field__input field__select"
                id="end"
                name="end"
                value={values.end}
                onChange={handleChange}
              >
                {ENDS.map((end) => (
                  <option key={end} value={end}>{end}</option>
                ))}
              </select>
            </div>

            <button type="submit" className="action-button action-button--teal">
              <RefreshIcon />
              Generate report
            </button>
          </form>
        </section>
      );
    }


    function StatCards() {
      return (
        <section className="stats">
          {STATS.map((stat) => (
            <article key={stat.label} className={`stat-card stat-card--${stat.tone}`}>
              <p className="stat-card__label">{stat.label}</p>
              <p className="stat-card__value">{stat.value}</p>
              <p className="stat-card__note">{stat.note}</p>
            </article>
          ))}
        </section>
      );
    }


    function VolumeChart() {
      return (
        <section className="panel">
          <div className="panel__header">
            <div>
              <h2 className="panel__title">Traffic volume by hour</h2>
              <p className="panel__subtitle">Vehicle classification · Both ends</p>
            </div>
          </div>

          <div className="chart">
            <div className="chart__legend">
              <span className="chart__legend-title">Vehicles (count)</span>
              <span className="chart__legend-item chart__legend-item--2w">2W</span>
              <span className="chart__legend-item chart__legend-item--4w">4W</span>
            </div>

            <div className="chart__scroll">
              <div className="chart__body chart__body--compact">
                <div className="chart__axis">
                  {AXIS.map((value) => (
                    <span key={value}>{value}</span>
                  ))}
                </div>

                <div className="chart__plot">
                  <div className="chart__grid" aria-hidden="true">
                    {AXIS.map((value) => (
                      <span key={value} className="chart__gridline" />
                    ))}
                  </div>

                  <div className="chart__bars">
                    {HOURLY.map((item) => (
                      <div key={item.hour} className="chart__col">
                        <div className="chart__stack">
                          <span
                            className="chart__bar chart__bar--4w"
                            style={{ height: `${(item.fourW / AXIS_MAX) * 100}%` }}
                            title={`${item.hour} · 4W: ${item.fourW}`}
                          />
                          <span
                            className="chart__bar chart__bar--2w"
                            style={{ height: `${(item.twoW / AXIS_MAX) * 100}%` }}
                            title={`${item.hour} · 2W: ${item.twoW}`}
                          />
                        </div>
                        <span className="chart__hour">{item.hour}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            <p className="chart__footnote">Hour of day · PHT · 14 Oct 2026</p>
          </div>
        </section>
      );
    }


    function WaitChart() {
      return (
        <section className="panel">
          <div className="panel__header">
            <div>
              <h2 className="panel__title">Average wait by hour</h2>
              <p className="panel__subtitle">Time before virtual right-of-way · Both ends</p>
            </div>
          </div>

          <div className="chart">
            <div className="chart__legend">
              <span className="chart__legend-title">Seconds (s)</span>
              <span className="chart__legend-item chart__legend-item--wait">Average wait</span>
            </div>

            <div className="chart__scroll">
              <div className="chart__body chart__body--compact">
                <div className="chart__axis">
                  {WAIT_AXIS.map((value) => (
                    <span key={value}>{value}</span>
                  ))}
                </div>

                <div className="chart__plot">
                  <div className="chart__grid" aria-hidden="true">
                    {WAIT_AXIS.map((value) => (
                      <span key={value} className="chart__gridline" />
                    ))}
                  </div>

                  <div className="chart__bars">
                    {WAIT_BY_HOUR.map((item) => (
                      <div key={item.hour} className="chart__col">
                        <div className="chart__stack">
                          <span
                            className="chart__bar chart__bar--wait"
                            style={{ height: `${(item.seconds / WAIT_AXIS_MAX) * 100}%` }}
                            title={`${item.hour} · ${item.seconds}s`}
                          />
                        </div>
                        <span className="chart__hour">{item.hour}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            <p className="chart__footnote">Hour of day · PHT · 14 Oct 2026</p>
          </div>
        </section>
      );
    }


    function EventHistory() {
      return (
        <section className="panel">
          <div className="panel__header panel__header--center">
            <h2 className="panel__title">Event history</h2>
            <p className="panel__meta">
              Showing {PAGINATION.showing} of {PAGINATION.total} events
            </p>
          </div>

          <div className="table-wrap">
            <table className="table">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>End</th>
                  <th>Class</th>
                  <th>Confidence</th>
                  <th>Decision</th>
                  <th>Wait</th>
                </tr>
              </thead>
              <tbody>
                {EVENTS.map((event) => (
                  <tr key={event.id}>
                    <td>{event.time}</td>
                    <td>{event.end}</td>
                    <td>{event.vehicle}</td>
                    <td>{event.confidence}</td>
                    <td>
                      <span className={`badge badge--${event.decision.toLowerCase()}`}>
                        <span className="badge__dot" />
                        {event.decision}
                      </span>
                    </td>
                    <td>{event.wait}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* 
            BACKEND: Lagyan nyo ng onClick yung Previous, page numbers and Next. I update nyo yung PAGINATION.current pag nag change ng page.
          */}
          <nav className="pagination" aria-label="Pagination">
            <button type="button" className="pagination__item" disabled={PAGINATION.current === 1}>
              ‹ Previous
            </button>
            {PAGINATION.pages.map((page) => (
              <button
                key={page}
                type="button"
                className={`pagination__item${page === PAGINATION.current ? ' is-active' : ''}`}
              >
                {page}
              </button>
            ))}
            <button
              type="button"
              className="pagination__item"
              disabled={PAGINATION.current === PAGINATION.pages.length}
            >
              Next ›
            </button>
          </nav>
        </section>
      );
    }


    function App() {
      return (
        <div className="page page--dashboard">
          <Sidebar />
          <main className="main">
            <Topbar />
            <div className="content">
              <ReportActions />
              <ReportFilters />
              <StatCards />
              <div className="chart-grid">
                <VolumeChart />
                <WaitChart />
              </div>
              <EventHistory />
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
