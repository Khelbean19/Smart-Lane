<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live control | Vision Vanguard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />


  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="root"></div>


  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <script src="/session.js"></script>
  <script src="/clock.js"></script>

  <script type="text/babel">

    /* 
    BACKEND: Lahat ng data sa page nato galing sa constants sa baba (EMERGENCY, SIGNALS, DECISION, DETECTIONS, MODES).
    REPLACE NYO YUNG CONSTANTS. DUN NYO ILAGAY YUNG API DATA.*/ 
    // BACKEND: EMERGENCY - Pag active: true magiging red yung banner. Yung title and text ay strings lang.
    const EMERGENCY = {
      active: false,
      title: 'No emergency priority active',
      text: 'Last clear completed at 14:42:48 · Corridor returned to automatic.',
    };

    // BACKEND: SIGNALS - isa per end (A and B). Yung light ay 'red', 'yellow' or 'green'. YUNG decision kailangan exactly 'Go' or 'Wait' kase eto pumipili ng card color. Yung waiting2w and waiting4w ay numbers.
    const SIGNALS = [
      { id: 'a', name: 'Camera A · North end', light: 'green', state: 'Green · Go', decision: 'Go', waiting2w: 2, waiting4w: 1 },
      { id: 'b', name: 'Camera B · South end', light: 'red', state: 'Red · Wait', decision: 'Wait', waiting2w: 3, waiting4w: 1 },
    ];

    // BACKEND: DECISION - Yung seconds ay natitirang seconds bago mag change ng decision. Yung progress ay number from 0 to 100 para sa bar.
    const DECISION = { direction: 'A: North → B: South', pairing: '2W + 2W', seconds: 18, progress: 35 };

    // BACKEND: DETECTIONS - latest detections, newest first (alam nyo nayan). Gawin nyong unique yung id (eto gagamitin as row key). YUNG decision kailangan exactly 'Go' or 'Wait' kase it picks the badge color. Yung time is HH:MM:SS in PHT.
    const DETECTIONS = [
      { id: 1, time: '15:24:08', end: 'A / North', vehicle: '4W · car', confidence: '98.4%', decision: 'Go' },
      { id: 2, time: '15:24:06', end: 'B / South', vehicle: '2W · bicycle', confidence: '96.2%', decision: 'Wait' },
      { id: 3, time: '15:24:04', end: 'A / North', vehicle: '2W · motorcycle', confidence: '95.7%', decision: 'Go' },
      { id: 4, time: '15:24:02', end: 'B / South', vehicle: '2W · motorcycle', confidence: '94.8%', decision: 'Wait' },
      { id: 5, time: '15:23:59', end: 'B / South', vehicle: '4W · van', confidence: '97.1%', decision: 'Wait' },
      { id: 6, time: '15:23:56', end: 'A / North', vehicle: '2W · bicycle', confidence: '96.8%', decision: 'Go' },
      { id: 7, time: '15:23:55', end: 'A / North', vehicle: '2W · bicycle', confidence: '96.8%', decision: 'Go' },
    ];

    // BACKEND: MODES - 'Manual' or 'Automatic' lang to.
    const MODES = ['Manual', 'Automatic'];
    const VISION_WORKER_URL = 'http://127.0.0.1:8001';

    const LAMPS = ['red', 'yellow', 'green'];

    const { useEffect, useRef, useState } = React;

    function LogoMark() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M7 20V4M3 8l4-4 4 4" />
          <path d="M17 4v16M13 16l4 4 4-4" />
        </svg>
      );
    }

    function DashboardIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </svg>
      );
    }

    function LiveIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="2" />
          <path d="M4.93 19.07a10 10 0 0 1 0-14.14" />
          <path d="M7.76 16.24a6 6 0 0 1 0-8.48" />
          <path d="M16.24 7.76a6 6 0 0 1 0 8.48" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        </svg>
      );
    }

    function ReportsIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M3 3v18h18" />
          <path d="M18 17V9" />
          <path d="M13 17V5" />
          <path d="M8 17v-3" />
        </svg>
      );
    }

    function UsersIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      );
    }

    function SettingsIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M21 4h-7" />
          <path d="M10 4H3" />
          <path d="M21 12h-9" />
          <path d="M8 12H3" />
          <path d="M21 20h-5" />
          <path d="M12 20H3" />
          <path d="M14 2v4" />
          <path d="M8 10v4" />
          <path d="M16 18v4" />
        </svg>
      );
    }

    function CalendarIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4" />
          <path d="M8 2v4" />
          <path d="M3 10h18" />
        </svg>
      );
    }

    function BellIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
      );
    }

    function LogoutIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="m16 17 5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
      );
    }

    function ArrowIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      );
    }

    function ShieldCheckIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      );
    }

    function RefreshIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
      );
    }

    function ArrowDownIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M12 5v14" />
          <path d="m19 12-7 7-7-7" />
        </svg>
      );
    }

    function ArrowUpIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="m5 12 7-7 7 7" />
          <path d="M12 19V5" />
        </svg>
      );
    }

    function StopIcon() {
      return (
        <svg className="icon-danger" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
        </svg>
      );
    }

    function SirenIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M7 18v-6a5 5 0 1 1 10 0v6" />
          <path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z" />
          <path d="M21 12h1" />
          <path d="M18.5 4.5 18 5" />
          <path d="M2 12h1" />
          <path d="M12 2v1" />
          <path d="m4.929 4.929.707.707" />
          <path d="M12 12v6" />
        </svg>
      );
    }

    const NAV_ITEMS = [
      { label: 'Dashboard', href: '/dashboard', icon: <DashboardIcon />, active: false },
      { label: 'Live control', href: '/live', icon: <LiveIcon />, active: true },
      { label: 'Reports', href: '/reports', icon: <ReportsIcon />, active: false },
      { label: 'Users', href: '/users', icon: <UsersIcon />, active: false },
      { label: 'Settings', href: '/settings', icon: <SettingsIcon />, active: false },
    ];


    function Sidebar({ onUserLoaded }) {
      const [currentUser, setCurrentUser] = useState(null);
      const [profileError, setProfileError] = useState(false);

      useEffect(() => {
        let isMounted = true;
        window.smartLaneSession.getCurrentUser()
          .then((user) => {
            if (isMounted && user) {
              setCurrentUser(user);
              onUserLoaded(user);
            }
          })
          .catch((error) => {
            console.error(error);
            if (isMounted) setProfileError(true);
          });
        return () => { isMounted = false; };
      }, []);

      return (
        <aside className="sidebar">
          <header className="brand brand--sidebar">
            <span className="brand__mark"><LogoMark /></span>
            <span className="brand__name">
              <span>Vision</span>
              <span>Vanguard</span>
            </span>
          </header>

          <p className="sidebar__label">Operations workspace</p>

          <nav className="nav">
            {NAV_ITEMS.map((item) => (
              <a
                key={item.label}
                className={`nav__item${item.active ? ' is-active' : ''}`}
                href={item.href}
              >
                {item.icon}
                <span>{item.label}</span>
              </a>
            ))}
          </nav>


          <footer className="sidebar__footer">
            <div className="user">
              <span className="user__avatar">
                {currentUser ? window.smartLaneSession.getInitials(currentUser) : ''}
              </span>
              <span className="user__info">
                <span className="user__name">
                  {currentUser ? currentUser.full_name : profileError ? 'Profile unavailable' : 'Loading profile...'}
                </span>
                <span className="user__role">
                  {currentUser ? window.smartLaneSession.formatRole(currentUser.role) : ''}
                </span>
              </span>
            </div>
          
            <button type="button" className="logout" onClick={window.smartLaneSession.logout}>
              <LogoutIcon />
              Logout
            </button>
          </footer>
        </aside>
      );
    }


    function Topbar() {
      const [currentTime, setCurrentTime] = useState(
        () => window.smartLaneClock.format(new Date()),
      );

      useEffect(() => {
        const timer = window.setInterval(
          () => setCurrentTime(window.smartLaneClock.format(new Date())),
          1000,
        );
        return () => window.clearInterval(timer);
      }, []);

      return (
        <header className="topbar">
          <h1 className="topbar__title">Live control</h1>

          <div className="topbar__actions">

            <button type="button" className="date-button">
              <CalendarIcon />
              Today
            </button>

            <p className="topbar__time">{currentTime}</p>

            <p className="badge badge--online">
              <span className="badge__dot" />
              System online
            </p>

            <span className="topbar__bell"><BellIcon /></span>
          </div>
        </header>
      );
    }



    function MiniLight({ active }) {
      return (
        <span className="mini-light">
          {LAMPS.map((color) => (
            <span
              key={color}
              className={`lamp lamp--${color}${active === color ? ' is-on' : ''}`}
            />
          ))}
        </span>
      );
    }


    function EmergencyBanner() {
      return (
        <section className={`alert-banner${EMERGENCY.active ? ' alert-banner--emergency' : ''}`}>
          {EMERGENCY.active ? <SirenIcon /> : <ShieldCheckIcon />}
          <p>
            <span className="alert-banner__title">{EMERGENCY.title}</span>
            <span className="alert-banner__text">{EMERGENCY.text}</span>
          </p>
        </section>
      );
    }


    function SignalCards() {
      return (
        <section className="signal-grid">
          {SIGNALS.map((signal) => (
            <article
              key={signal.id}
              className={`signal-box signal-box--${signal.decision.toLowerCase()}`}
            >
              <p className="signal-box__name">{signal.name}</p>
              <div className="signal-box__row">
                <MiniLight active={signal.light} />
                <p className="signal-box__state">{signal.state}</p>
              </div>
              <p className="signal-box__waiting">
                Waiting: 2W {signal.waiting2w} · 4W {signal.waiting4w}
              </p>
            </article>
          ))}

          <article className="decision-card">
            <p className="decision-card__label">Current decision</p>
            <p className="decision-card__value">{DECISION.direction}</p>
            <div className="decision-card__row">
              <div>
                <p className="decision-card__note">Pairing allowed: {DECISION.pairing}</p>
                <p className="decision-card__note">Next change in:</p>
              </div>
              <p className="decision-card__seconds">{DECISION.seconds}s</p>
            </div>
            <span className="progress">
              <span className="progress__bar" style={{ width: `${DECISION.progress}%` }} />
            </span>
          </article>
        </section>
      );
    }


    function CameraPanels({
      cameraState,
      loading,
      error,
      stagedAssignments,
      dirty,
      saving,
      isAdmin,
      onSelectionChange,
      onApply,
    }) {
      return (
        <section className="camera-section">
          {loading && <p className="camera__message">Loading camera slots…</p>}
          {error && <p className="camera__message camera__message--error" role="alert">{error}</p>}
          {cameraState && (
            <>
              {cameraState.worker_error && (
                <p className="camera__message camera__message--error" role="status">
                  Vision worker unavailable: {cameraState.worker_error}
                </p>
              )}
              {cameraState.activation_errors.map((item) => (
                <p key={item.camera_id} className="camera__message camera__message--error" role="status">
                  Camera {item.camera_id}: {item.error}
                </p>
              ))}
              <section className="camera-grid">
                {cameraState.slots.map((slot) => {
                  const statusClass = slot.status === 'ONLINE'
                    ? 'badge--active'
                    : slot.status === 'FAULT' ? 'badge--wait' : 'badge--disabled';
                  const assigned = slot.camera_id !== null;
                  const selectedCamera = stagedAssignments[slot.slot_id] || '';

                  return (
                    <article key={slot.slot_id} className="panel">
                      <div className="panel__header panel__header--center">
                        <div>
                          <h2 className="panel__title">{slot.camera_name || 'Camera slot'}</h2>
                          <p className="panel__subtitle">{slot.region}</p>
                        </div>
                        <span className={`badge ${statusClass}`}>
                          <span className="badge__dot" />
                          {slot.status}
                        </span>
                      </div>

                      <div className="camera__view">
                        {assigned && slot.status === 'ONLINE'
                          ? (
                            <img
                              className="camera__stream"
                              src={`${VISION_WORKER_URL}/camera/${slot.camera_id}/stream`}
                              alt={`Live feed for ${slot.camera_name}`}
                            />
                          )
                          : (
                            <div className="camera__empty">
                              {assigned ? 'Camera feed unavailable' : 'No camera assigned'}
                            </div>
                          )}
                        {isAdmin && assigned && (
                          <span className="camera__tag">Source {slot.source}</span>
                        )}
                      </div>

                      {isAdmin && (
                        <label className="camera-slot__label">
                          Camera for {slot.region}
                          <select
                            className="camera-slot__select"
                            value={selectedCamera}
                            onChange={(event) => onSelectionChange(slot.slot_id, event.target.value)}
                            disabled={saving}
                          >
                            <option value="">Inactive — no camera</option>
                            {cameraState.cameras.map((camera) => {
                              const chosenElsewhere = cameraState.slots.some(
                                (otherSlot) =>
                                  otherSlot.slot_id !== slot.slot_id
                                  && stagedAssignments[otherSlot.slot_id] === String(camera.camera_id),
                              );
                              return (
                                <option
                                  key={camera.camera_id}
                                  value={String(camera.camera_id)}
                                  disabled={chosenElsewhere}
                                >
                                  {camera.camera_name} · {camera.region} · Source {camera.source} · {camera.status}
                                </option>
                              );
                            })}
                          </select>
                        </label>
                      )}
                    </article>
                  );
                })}
              </section>
              {isAdmin && (
                <div className="camera-slot__actions">
                  <button
                    type="button"
                    className="action-button action-button--teal"
                    disabled={!dirty || saving}
                    onClick={onApply}
                  >
                    {saving ? 'Applying camera setup…' : 'Apply camera setup'}
                  </button>
                </div>
              )}
            </>
          )}
        </section>
      );
    }


    function ManualControl() {
      // BACKEND: Yung mode ay 'Manual' or 'Automatic'. Eto yung ise send nyo sa controller pag pinindot yung tabs.
      // BACKEND: Yung minutes ang manual timeout (1 to 5). Pag nag end yung timeout dapat bumalik sa Automatic.
      const [mode, setMode] = useState('Manual');
      const [minutes, setMinutes] = useState(2);

      return (
        <section className="panel">
          <h2 className="panel__title">Manual control</h2>
          <p className="panel__subtitle">Virtual signal commands only</p>

          <div className="segmented">
            {MODES.map((item) => (
              <button
                key={item}
                type="button"
                className={`segmented__item${mode === item ? ' is-active' : ''}`}
                onClick={() => setMode(item)}
                aria-pressed={mode === item}
              >
                {item}
              </button>
            ))}
          </div>

          {/* 
            BACKEND: Lagyan nyo ng onClick lahat ng buttons dito (Allow A, Allow B, Stop Both, Return to Automatic, Emergency clear).
            Virtual signal commands lang to kase simulation (alam nyo nayan).
          */}
          <div className="control-list">
            <button type="button" className="action-button action-button--light action-button--full">
              <ArrowDownIcon />
              Allow A · North → South
            </button>
            <button type="button" className="action-button action-button--light action-button--full">
              <ArrowUpIcon />
              Allow B · South → North
            </button>
            <button type="button" className="action-button action-button--light action-button--full">
              <StopIcon />
              Stop Both
            </button>
            <button type="button" className="action-button action-button--teal action-button--full">
              <RefreshIcon />
              Return to Automatic
            </button>
            <button type="button" className="action-button action-button--red action-button--full">
              <SirenIcon />
              Emergency clear
            </button>
          </div>

          <div className="range-block">
            <p className="range-block__label">
              Manual timeout: {minutes} {minutes === 1 ? 'min' : 'mins'}
            </p>
            <input
              type="range"
              className="range"
              min="1"
              max="5"
              step="1"
              value={minutes}
              onChange={(event) => setMinutes(Number(event.target.value))}
              aria-label="Manual timeout in minutes"
            />
          </div>
        </section>
      );
    }


    function LiveDetections() {
      return (
        <section className="panel">
          <div className="panel__header panel__header--center">
            <h2 className="panel__title">Live detections</h2>
            <a className="text-link text-link--small" href="/reports">
              View all detections
              <ArrowIcon />
            </a>
          </div>

          <div className="table-wrap">
            <table className="table">
              <thead>
                <tr>
                  <th>Time (PHT)</th>
                  <th>End</th>
                  <th>Class</th>
                  <th>Confidence</th>
                  <th>Decision</th>
                </tr>
              </thead>
              <tbody>
                {DETECTIONS.map((detection) => (
                  <tr key={detection.id}>
                    <td>{detection.time}</td>
                    <td>{detection.end}</td>
                    <td>{detection.vehicle}</td>
                    <td>{detection.confidence}</td>
                    <td>
                      <span className={`badge badge--${detection.decision.toLowerCase()}`}>
                        <span className="badge__dot" />
                        {detection.decision}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      );
    }


    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [cameraState, setCameraState] = useState(null);
      const [stagedAssignments, setStagedAssignments] = useState({});
      const [cameraLoading, setCameraLoading] = useState(true);
      const [cameraSaving, setCameraSaving] = useState(false);
      const [cameraError, setCameraError] = useState('');
      const hasUnsavedChanges = useRef(false);

      useEffect(() => {
        let isMounted = true;
        let isInitialLoad = true;

        async function refreshCameraSlots() {
          try {
            const response = await window.smartLaneSession.authenticatedFetch(
              '/api/v1/vision/camera-slots',
            );
            const body = await response.json();
            if (!response.ok) {
              throw new Error(body.detail || `Could not load camera slots (HTTP ${response.status}).`);
            }
            if (!isMounted) return;
            setCameraState(body);
            setCameraError('');
            if (!hasUnsavedChanges.current) {
              setStagedAssignments(Object.fromEntries(
                body.slots.map((slot) => [
                  slot.slot_id,
                  slot.camera_id === null ? '' : String(slot.camera_id),
                ]),
              ));
            }
          } catch (loadError) {
            console.error(loadError);
            if (isMounted) setCameraError(loadError.message);
          } finally {
            if (isMounted && isInitialLoad) {
              setCameraLoading(false);
              isInitialLoad = false;
            }
          }
        }

        refreshCameraSlots();
        const timer = window.setInterval(refreshCameraSlots, 10000);
        return () => {
          isMounted = false;
          window.clearInterval(timer);
        };
      }, []);

      const dirty = Boolean(cameraState) && cameraState.slots.some((slot) => (
        (stagedAssignments[slot.slot_id] || '')
        !== (slot.camera_id === null ? '' : String(slot.camera_id))
      ));

      useEffect(() => {
        hasUnsavedChanges.current = dirty;
      }, [dirty]);

      function updateStagedAssignment(slotId, cameraId) {
        setStagedAssignments((previous) => ({
          ...previous,
          [slotId]: cameraId,
        }));
      }

      async function applyCameraSetup() {
        if (!dirty || !window.confirm(
          'Applying this camera setup may stop or restart camera streams. Continue?',
        )) return;

        setCameraSaving(true);
        setCameraError('');
        try {
          const response = await window.smartLaneSession.authenticatedFetch(
            '/api/v1/vision/camera-slots',
            {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                assignments: cameraState.slots.map((slot) => ({
                  slot_id: slot.slot_id,
                  camera_id: stagedAssignments[slot.slot_id]
                    ? Number(stagedAssignments[slot.slot_id])
                    : null,
                })),
              }),
            },
          );
          const body = await response.json();
          if (!response.ok) {
            throw new Error(body.detail || `Could not apply camera setup (HTTP ${response.status}).`);
          }
          setCameraState(body);
          setStagedAssignments(Object.fromEntries(
            body.slots.map((slot) => [
              slot.slot_id,
              slot.camera_id === null ? '' : String(slot.camera_id),
            ]),
          ));
          hasUnsavedChanges.current = false;
        } catch (saveError) {
          console.error(saveError);
          setCameraError(saveError.message);
        } finally {
          setCameraSaving(false);
        }
      }

      return (
        <div className="page page--dashboard">
          <Sidebar onUserLoaded={setCurrentUser} />
          <main className="main">
            <Topbar />
            <div className="content">
              <EmergencyBanner />
              <SignalCards />
              <CameraPanels
                cameraState={cameraState}
                loading={cameraLoading}
                error={cameraError}
                stagedAssignments={stagedAssignments}
                dirty={dirty}
                saving={cameraSaving}
                isAdmin={currentUser && currentUser.role === 'ADMINISTRATOR'}
                onSelectionChange={updateStagedAssignment}
                onApply={applyCameraSetup}
              />
              <div className="split split--right">
                <ManualControl />
                <LiveDetections />
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
