<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | SmartLane</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />


  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="root"></div>


  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;


    function LogoMark() {
      return (
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M7 20V4M3 8l4-4 4 4" />
          <path d="M17 4v16M13 16l4 4 4-4" />
        </svg>
      );
    }

    function ArrowIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      );
    }

    function EyeIcon({ hidden }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          {hidden ? (
            <>
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
              <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <path d="m2 2 20 20" />
            </>
          ) : (
            <>
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </>
          )}
        </svg>
      );
    }

    function LockIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      );
    }

    const LAMPS = ['red', 'yellow', 'green'];

    function TrafficLight({ side, active }) {
      return (
        <div className={`traffic-light traffic-light--${side}`}>
          {LAMPS.map((color) => (
            <span
              key={color}
              className={`lamp lamp--${color}${active === color ? ' is-on' : ''}`}
            />
          ))}
        </div>
      );
    }

    function SignalCard() {
      return (
        <div className="signal-card">
          <div className="signal-card__header">
            <span className="signal-card__title">Virtual signal coordination</span>
            <span className="signal-card__tag">Simulation</span>
          </div>

          <div className="signal-card__scene">
            {/* 
              LOUI OR STEPHEN: etong label and lamp colors sa baba ay static preview. 
              Update nyo to if they should follow the live signal state. 
              */}
            <p className="signal-label signal-label--a">A / North · Go</p>

            <div className="road" aria-hidden="true">
              {/* 
                LOUI OR STEPEHN: Yung active ina accept nyalang ay 'red', 'yellow' or 'green'. 
                */}
              <TrafficLight side="a" active="green" />
              <span className="road__line" />
              <span className="vehicle vehicle--4w" />
              <svg className="road__arrow" viewBox="0 0 160 24">
                <line x1="2" y1="12" x2="156" y2="12" />
                <polyline points="142,1 156,12 142,23" />
              </svg>
              <span className="vehicle vehicle--2w" />
              <TrafficLight side="b" active="red" />
            </div>

            <p className="signal-label signal-label--b">B / South · Wait</p>
          </div>

          <div className="signal-card__legend">
            <span>2W · motorcycle / bicycle</span>
            <span>4W · car / van / trucks</span>
          </div>
        </div>
      );
    }


    function BrandPanel() {
      return (
        <section className="brand-panel">
          <header className="brand">
            <span className="brand__mark"><LogoMark /></span>
            <span className="brand__name">
              <span>Smart</span>
              <span>Lane</span>
            </span>
          </header>

          <div className="brand-panel__main">
            <h1 className="hero-title">
              <span>One lane. Two directions.</span>
              <span>A clearer way forward.</span>
            </h1>
            <p className="hero-text">
              A smart traffic light system with vehicle classification for
              single-lane bi-directional roads.
            </p>

            <SignalCard />
          </div>

          <footer className="brand-panel__footer">
            {/* 
              LOUI OR STEPHEN CURRY: status, location and agency AY STATIC OR FIXED text. 
              Baguhin nyo lang to kung sa tingin nyo need sila mang galing sa system settings.
              */}
            <p className="status">
              <span className="status__dot" />
              System online
            </p>
            <p className="location">Bahay Pari Street, Valenzuela City</p>
            <p className="agency">Valenzuela City TMO / Brgy. Gen. T. de Leon</p>
          </footer>
        </section>
      );
    }


    function LoginPanel() {
      // LOUIGIE or STEPHEN CURRY: Yunng form field names ay username, password and remember. 
      // Eto gamitin nyo pag mag se send login request.
      const [values, setValues] = useState({ username: '', password: '', remember: false });
      const [showPassword, setShowPassword] = useState(false);

      const handleChange = (event) => {
        const { name, type, value, checked } = event.target;
        setValues((prev) => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value,
        }));
      };

      const handleSubmit = (event) => {
        event.preventDefault();
        // LOU or STEPH: ise send nyo yung values.username, values.password and values.remember sa login endpoint dito.
        // LOU or STEPH: Pag success redirect sa dashboard.html. On failure show an error message (Alam nyo nayan basic error handling lang yan).


      };

      return (
        <section className="login-panel">
          <div className="login-card">
            <h2 className="login-card__title">Welcome back!</h2>
            <p className="login-card__subtitle">Sign in to your SmartLane workspace.</p>
            <p className="login-card__notice">Authorized barangay and TMO personnel only.</p>

            <form className="login-form" onSubmit={handleSubmit}>
              <div className="field">
                <label className="field__label" htmlFor="username">Username or email</label>
                <input
                  className="field__input"
                  id="username"
                  name="username"
                  type="text"
                  placeholder="Enter your username or email"
                  autoComplete="username"
                  value={values.username}
                  onChange={handleChange}
                  required
                />
              </div>

              <div className="field">
                <label className="field__label" htmlFor="password">Password</label>
                <div className="field__control">
                  <input
                    className="field__input field__input--password"
                    id="password"
                    name="password"
                    type={showPassword ? 'text' : 'password'}
                    placeholder="Enter your password"
                    autoComplete="current-password"
                    value={values.password}
                    onChange={handleChange}
                    required
                  />
                  <button
                    type="button"
                    className="icon-button"
                    onClick={() => setShowPassword((prev) => !prev)}
                    aria-label={showPassword ? 'Hide password' : 'Show password'}
                    aria-pressed={showPassword}
                  >
                    <EyeIcon hidden={!showPassword} />
                  </button>
                </div>
              </div>

              {/* LOU or STEPH: I point nyo yung "Forgot password?" href below papunta sa password reset page. */}
              <div className="form-row">
                <label className="checkbox">
                  <input
                    type="checkbox"
                    name="remember"
                    checked={values.remember}
                    onChange={handleChange}
                  />
                  <span>Remember me</span>
                </label>
                <a className="text-link" href="#forgot-password">Forgot password?</a>
              </div>

              <button type="submit" className="btn btn--primary">
                <ArrowIcon />
                Sign in to SmartLane
              </button>
            </form>

            <p className="login-card__help">Need access? Contact your system administrator.</p>
          </div>

          <p className="restricted">
            <LockIcon />
            Restricted workspace
          </p>
        </section>
      );
    }


    function App() {
      return (
        <main className="page">
          <BrandPanel />
          <LoginPanel />
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
