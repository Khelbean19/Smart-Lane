<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status | SmartLane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <section class="brand-panel">
      <header class="brand">
        <span class="brand__mark" aria-hidden="true">SL</span>
        <span class="brand__name"><span>Smart</span><span>Lane</span></span>
      </header>
      <div class="brand-panel__main">
        <h1 class="hero-title"><span>One lane.</span><span>Two directions.</span></h1>
        <p class="hero-text">Smart traffic coordination for safer journeys.</p>
        <div class="signal-card">
          <p class="signal-card__title">SmartLane operations workspace</p>
          <div class="signal-card__scene">
            <p class="signal-label">Service status</p>
          </div>
        </div>
      </div>
      <footer class="brand-panel__footer">
        <p class="status"><span class="status__dot" />System online</p>
      </footer>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <h2 class="login-card__title">SmartLane is online</h2>
        <p class="login-card__subtitle">The backend service is responding.</p>
        <p class="login-card__notice badge badge--online">
          <span class="badge__dot" />System online
        </p>
        <p id="status-clock" class="login-card__help" aria-live="off"></p>
        <a class="btn btn--primary" href="/">Go to sign in</a>
      </div>
    </section>
  </main>
  <script src="/clock.js"></script>
  <script>
    const statusClock = document.getElementById('status-clock');
    const updateStatusClock = () => {
      statusClock.textContent = window.smartLaneClock.format(new Date());
    };
    updateStatusClock();
    window.setInterval(updateStatusClock, 1000);
  </script>
</body>
</html>
